name: Cross-Platform Release Builds

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to upload assets to (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (${{ matrix.display_name }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
            display_name: Apple Silicon (ARM64)
          - target: x86_64-apple-darwin
            arch: x64
            display_name: Intel (x64)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Build Tauri App
        run: |
          npm run tauri build -- --target ${{ matrix.target }}

      - name: Stage Release Assets
        run: |
          mkdir -p dist-assets
          find src-tauri/target/${{ matrix.target }}/release/bundle/dmg -name "*.dmg" -exec cp {} dist-assets/ \;
          find src-tauri/target/${{ matrix.target }}/release/bundle/macos -name "*.app.tar.gz" -exec cp {} "dist-assets/FileHarbor_0.2.0_${{ matrix.arch }}.app.tar.gz" \; || true
          ls -lh dist-assets

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist-assets/*

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag || github.ref_name || 'v0.2.0' }}"
          echo "Uploading assets to release $TAG..."
          gh release upload "$TAG" dist-assets/* --clobber

  build-linux:
    name: Build Linux (x64 DEB & AppImage)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Ubuntu Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Build Tauri App
        run: |
          npm run tauri build

      - name: Stage Release Assets
        run: |
          mkdir -p dist-assets
          find src-tauri/target/release/bundle/appimage -name "*.AppImage" -exec cp {} dist-assets/ \;
          find src-tauri/target/release/bundle/deb -name "*.deb" -exec cp {} dist-assets/ \;
          ls -lh dist-assets

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist-assets/*

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag || github.ref_name || 'v0.2.0' }}"
          echo "Uploading assets to release $TAG..."
          gh release upload "$TAG" dist-assets/* --clobber
