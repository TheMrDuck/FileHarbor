<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 90" width="400" height="90">
  <defs>
    <linearGradient id="beam-glow-h" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="tower-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="harbor-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
  </defs>

  <!-- Left Icon Symbol (Lighthouse + Beam + File) -->
  <g transform="translate(10, 5)">
    <!-- Base Rock -->
    <path d="M22 68 L58 68 L64 74 L16 74 Z" fill="#1E293B" />
    <!-- Water ripples -->
    <path d="M12 73 C 24 70, 36 75, 48 72 C 60 69, 70 74, 80 71" fill="none" stroke="#0284C7" stroke-width="2" stroke-linecap="round" opacity="0.6" />

    <!-- Light Beam with File Fold -->
    <polygon points="40,28 78,12 74,54" fill="url(#beam-glow-h)" />
    <!-- Miniature Document in Beam -->
    <path d="M54,20 L68,20 L73,25 L73,42 L54,42 Z" fill="#FFFFFF" opacity="0.9" />
    <path d="M68,20 L68,25 L73,25 Z" fill="#7DD3FC" />

    <!-- Tower -->
    <polygon points="32,68 48,68 45,34 35,34" fill="url(#tower-grad-h)" />
    <polygon points="33,59 47,59 46,53 34,53" fill="#0284C7" />
    <polygon points="34.5,46 45.5,46 45,41 35,41" fill="#0284C7" />

    <!-- Lantern Room -->
    <rect x="34" y="24" width="12" height="10" rx="1.5" fill="#0F172A" stroke="#64748B" stroke-width="1" />
    <!-- Lamp core -->
    <circle cx="40" cy="29" r="3.5" fill="#FFFFFF" />
    <circle cx="40" cy="29" r="6" fill="#38BDF8" opacity="0.7" />
    <!-- Cupola dome -->
    <path d="M33 24 Q 40 16, 47 24 Z" fill="#0F172A" />
  </g>

  <!-- Right Wordmark & Subtitle -->
  <g transform="translate(102, 10)">
    <!-- Main Title -->
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="36" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">
      File<tspan fill="url(#harbor-text-grad)">Harbor</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#64748B" letter-spacing="3.2">
      DATA SANCTUARY &amp; VAULT
    </text>
  </g>
</svg>
