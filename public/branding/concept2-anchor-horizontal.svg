<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 90" width="400" height="90">
  <defs>
    <linearGradient id="shield-glow-h" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="anchor-metal-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="brand-teal-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Left Icon Symbol (Shield + Anchor) -->
  <g transform="translate(14, 6)">
    <!-- Shield Outline -->
    <path d="M38 6 L64 16 C64 50 38 72 38 76 C38 72 12 50 12 16 Z" 
          fill="#0B1A2E" 
          stroke="url(#shield-glow-h)" 
          stroke-width="2.5" 
          stroke-linejoin="round" />

    <!-- Three mini data slabs -->
    <path d="M26 36 L50 36 L46 40 L30 40 Z" fill="#38BDF8" opacity="0.9" />
    <path d="M24 43 L52 43 L48 47 L28 47 Z" fill="#06B6D4" opacity="0.9" />
    <path d="M22 50 L54 50 L50 54 L26 54 Z" fill="#10B981" opacity="0.9" />

    <!-- Anchor Ring -->
    <circle cx="38" cy="22" r="5.5" fill="none" stroke="url(#anchor-metal-h)" stroke-width="2.2" />

    <!-- Anchor Stock -->
    <line x1="24" y1="29" x2="52" y2="29" stroke="url(#anchor-metal-h)" stroke-width="3" stroke-linecap="round" />

    <!-- Anchor Shank -->
    <line x1="38" y1="26" x2="38" y2="64" stroke="url(#anchor-metal-h)" stroke-width="3.5" />

    <!-- Anchor Flukes -->
    <path d="M18 46 C18 64 38 68 38 68 C38 68 58 64 58 46" 
          fill="none" 
          stroke="url(#anchor-metal-h)" 
          stroke-width="3.2" 
          stroke-linecap="round" />
  </g>

  <!-- Right Wordmark & Subtitle -->
  <g transform="translate(102, 10)">
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="36" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">
      File<tspan fill="url(#brand-teal-grad)">Harbor</tspan>
    </text>

    <text x="2" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#64748B" letter-spacing="3.2">
      SECURE LOCAL RESILIENCE
    </text>
  </g>
</svg>
