<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="beacon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071527" />
      <stop offset="50%" stop-color="#0B2545" />
      <stop offset="100%" stop-color="#08101E" />
    </linearGradient>

    <linearGradient id="beam-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="tower-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>

    <linearGradient id="file-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.75" />
    </linearGradient>

    <filter id="light-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="256" height="256" rx="56" fill="url(#beacon-bg)" />
  <rect width="254" height="254" x="1" y="1" rx="55" fill="none" stroke="#1E3A5F" stroke-width="2" opacity="0.6" />

  <!-- Harbor Water Waves (Base) -->
  <path d="M30 196 C 65 190, 85 204, 128 198 C 171 192, 195 204, 226 196" fill="none" stroke="url(#wave-grad)" stroke-width="4" stroke-linecap="round" opacity="0.4" />
  <path d="M42 212 C 75 206, 95 218, 128 212 C 161 206, 185 218, 214 212" fill="none" stroke="url(#wave-grad)" stroke-width="3" stroke-linecap="round" opacity="0.25" />

  <!-- Radiating Beacon Light Cone (Forms File Angle) -->
  <polygon points="128,88 230,42 220,165" fill="url(#beam-glow)" />

  <!-- Guided File Silhouette within the Beacon Light -->
  <g transform="matrix(0.85 0.12 -0.1 0.85 58 -4)">
    <path d="M142,66 L186,66 L202,82 L202,130 L142,130 Z" fill="url(#file-card-grad)" />
    <!-- File Fold -->
    <path d="M186,66 L186,82 L202,82 Z" fill="#7DD3FC" opacity="0.9" />
    <!-- File lines -->
    <line x1="152" y1="88" x2="178" y2="88" stroke="#0284C7" stroke-width="3" stroke-linecap="round" />
    <line x1="152" y1="100" x2="190" y2="100" stroke="#0284C7" stroke-width="3" stroke-linecap="round" />
    <line x1="152" y1="112" x2="174" y2="112" stroke="#0284C7" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Lighthouse Foundation / Rock -->
  <path d="M92 192 L164 192 L172 202 L84 202 Z" fill="#0F172A" stroke="#1E293B" stroke-width="2" />

  <!-- Lighthouse Tower (Geometric modern styling) -->
  <polygon points="112,192 144,192 138,102 118,102" fill="url(#tower-grad)" />
  <!-- Architectural Bands on Tower -->
  <polygon points="113.8,168 142.2,168 140.6,152 115.4,152" fill="#0284C7" />
  <polygon points="116.5,132 139.5,132 138.5,120 117.5,120" fill="#0284C7" />

  <!-- Gallery Deck & Railing -->
  <rect x="111" y="98" width="34" height="4" rx="2" fill="#0F172A" />
  <line x1="113" y1="94" x2="143" y2="94" stroke="#64748B" stroke-width="1.5" />

  <!-- Lantern Room -->
  <rect x="117" y="80" width="22" height="18" rx="2" fill="#0B132B" stroke="#64748B" stroke-width="1.5" />
  <!-- Glowing Beacon Lamp Core -->
  <circle cx="128" cy="89" r="6" fill="#F8FAFC" />
  <circle cx="128" cy="89" r="14" fill="#38BDF8" opacity="0.6" filter="url(#light-blur)" />

  <!-- Lighthouse Cupola / Roof Dome -->
  <path d="M115 80 Q 128 66, 141 80 Z" fill="#0F172A" />
  <circle cx="128" cy="67" r="2.5" fill="#38BDF8" />
</svg>
