[workspace]
members = [".", "crates/organizer-core", "crates/test-data-generator"]
resolver = "2"

[package]
name = "file-organizer"
version = "0.2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
organizer-core = { path = "crates/organizer-core" }
test-data-generator = { path = "crates/test-data-generator" }
tauri = { version = "2", features = ["devtools", "protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2.9", features = ["json"] }


[profile.release]
lto = true
codegen-units = 1
